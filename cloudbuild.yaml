steps:
  # 1. Copy the single-file frontend into backend/static for single-container deployment
  - name: 'bash'
    args:
      - '-c'
      - |
        mkdir -p backend/static && cp frontend/index.html backend/static/index.html
    id: 'bundle-static'

  # 2. Build Backend Docker Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/unlisted:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/unlisted:latest'
      - './backend'
    id: 'build-container'
    waitFor: ['bundle-static']

  # 3. Push Docker Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/unlisted:$COMMIT_SHA'
    id: 'push-image'
    waitFor: ['build-container']

  # 4. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'unlisted-app'
      - '--image=gcr.io/$PROJECT_ID/unlisted:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--set-env-vars=HOST=0.0.0.0'
    id: 'deploy-cloud-run'
    waitFor: ['push-image']

images:
  - 'gcr.io/$PROJECT_ID/unlisted:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/unlisted:latest'

timeout: '1200s'
